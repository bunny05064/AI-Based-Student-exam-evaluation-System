service: "bento.service:EvaluationService"
name: "ai-answer-evaluation"
labels:
  framework: "flask+sklearn"
  description: "Explainable student answer evaluation and personalized feedback"
include:
  - "bento/**/*.py"
  - "app/**/*.py"
  - "src/**/*.py"
  - "config.py"
  - "requirements.txt"
  - "bentofile.yaml"
python:
  packages:
    - "bentoml>=1.3"
    - "flask>=3.0"
    - "flask-cors>=4.0"
    - "SQLAlchemy>=2.0"
    - "Flask-SQLAlchemy>=3.1"
    - "pydantic>=2.0"
    - "python-dotenv>=1.0"
    - "numpy>=1.26"
    - "pandas>=2.0"
    - "scikit-learn>=1.3"
    - "Pillow>=10.0"
models: []